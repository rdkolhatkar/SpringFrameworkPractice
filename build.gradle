plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.ratnakar.practice'
version = '1.0-SNAPSHOT'
java.sourceCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

// ------------------------------
// 🔧 Centralized Version Variables
// ------------------------------
ext {
    lombokVersion = '1.18.32'
    junitVersion = '5.10.0'
    postgreSqlDriver = '42.7.7'
    mySqlConnector = '8.3.0'
    jakartaServletJspApi = '3.1.1'
}

// ------------------------------
// 🧩 Dependencies
// ------------------------------
dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Databases
    implementation "org.postgresql:postgresql:${postgreSqlDriver}"
    implementation "com.mysql:mysql-connector-j:${mySqlConnector}"

    // JSP / JSTL / Servlet
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation "jakarta.servlet.jsp:jakarta.servlet.jsp-api:${jakartaServletJspApi}"
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:2.0.0'

    // Lombok
    implementation "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

// ------------------------------
// 📂 Additional Source Sets for 2nd App
// ------------------------------
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }

    code {
        java.srcDirs = ['src/code/java']
        resources.srcDirs = ['src/code/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    app {
        java.srcDirs = ['src/app/java']
        resources.srcDirs = ['src/app/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

// ------------------------------
// ⚙️ Custom BootRun Tasks for Each App
// ------------------------------
tasks.register('runMainApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the main Spring Boot app'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.ratnakar.practice.MainApplication')
}

tasks.register('runCodeApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the secondary Spring Boot app from src/code/java'
    classpath = sourceSets.code.runtimeClasspath
    mainClass.set('org.ratnakar.practice.CodeApplication')
}

tasks.register('runTestApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the Spring Boot app from src/test/java'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.practice.ratnakar.ServletApplication')
}

tasks.register('runApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the Spring Boot app from src/app/java'
    classpath = sourceSets.app.runtimeClasspath
    mainClass.set('com.ratnakar.web.SpringWebApplication')
}
