plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}
apply plugin: 'io.spring.dependency-management'

group = 'org.ratnakar.practice'
version = '1.0-SNAPSHOT'
java.sourceCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

// ------------------------------
// 🔧 Centralized Version Variables
// ------------------------------
ext {
    springBootVersion = '3.3.5'
    lombokVersion = '1.18.32'
    junitVersion = '5.10.0'
    h2dbVersion = '2.3.232'
    springbootStarterJdbc = '3.3.5'
    springJdbcVersion = '6.2.10'
    springbootStarterDataJdbc = '3.5.5'
    postgreSqlDriver='42.7.7'
    jakartaServerlet = '6.0.0'
    tomcatEmbededCore = '10.1.30'
    springWeb = '7.0.0'
    //tomcatVersion = '10.1.24'
    servletApi = '6.0.0'
    tomcatJasper = '10.1.30'
    mySqlConnector = '8.3.0'
}

// ------------------------------
// 🧩 Dependencies
// ------------------------------
dependencies {
    /*
    implementation "org.springframework.boot:spring-boot-starter:${springBootVersion}"
    implementation("com.h2database:h2:${h2dbVersion}")
    implementation("org.springframework.boot:spring-boot-starter-jdbc:${springbootStarterJdbc}")
    implementation("org.springframework:spring-jdbc:${springJdbcVersion}")
    implementation("org.springframework.boot:spring-boot-starter-data-jdbc:${springbootStarterDataJdbc}")
    */
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-data-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.projectlombok:lombok"
    implementation("org.apache.tomcat.embed:tomcat-embed-el:${tomcatEmbededCore}")
    implementation("org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatEmbededCore}")
    //implementation "com.h2database:h2:${h2dbVersion}"
    implementation("org.postgresql:postgresql:${postgreSqlDriver}")
    implementation("org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbededCore}")
    implementation("org.apache.tomcat:tomcat-jasper:${tomcatJasper}")
    implementation("com.mysql:mysql-connector-j:${mySqlConnector}")
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    compileOnly("jakarta.servlet:jakarta.servlet-api:${jakartaServerlet}")
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcatEmbededCore}"
    testImplementation "jakarta.servlet:jakarta.servlet-api:${servletApi}"
}

test {
    useJUnitPlatform()
}

// ------------------------------
// 📂 Additional Source Set for 2nd App
// ------------------------------
sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }

    code {
        java.srcDirs = ['src/code/java']
        resources.srcDirs = ['src/code/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    app {
        java.srcDirs = ['src/app/java']
        resources.srcDirs = ['src/app/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }

    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

// ------------------------------
// ⚙️ Custom BootRun Tasks for Each App
// ------------------------------

// Run the Spring Boot main app (src/main/java)
tasks.register('runMainApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the main Spring Boot app'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.ratnakar.practice.MainApplication') // <-- update your actual class name
}

// Run the Spring Boot code app (src/code/java)
tasks.register('runCodeApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the secondary Spring Boot app from src/code/java'
    classpath = sourceSets.code.runtimeClasspath
    mainClass.set('org.ratnakar.practice.CodeApplication') // <-- update your actual class name
}

// Run the Spring Boot app from src/test/java
tasks.register('runTestApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the Spring Boot app from src/test/java'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.practice.ratnakar.ServletApplication') // <-- replace with your test app's main class
}
// Run the Spring Boot app from src/app/java
tasks.register('runApp', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the Spring Boot app from src/app/java'
    classpath = sourceSets.app.runtimeClasspath
    mainClass.set('com.ratnakar.web.SpringWebApplication')   // <-- replace with actual main class
}
